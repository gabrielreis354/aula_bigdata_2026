name: "Lab check (fork) - Aula 02 (Hadoop & MapReduce)"

# Workflow auxiliar do aluno: o fork nao dispara o workflow oficial de
# correcao (ci-aula-02.yml), que so roda em pull_request no repo upstream.
# Este aqui roda a MESMA verificacao (docker build + pytest) em push para
# a branch da entrega, so para ter o check verde no fork.

on:
  push:
    branches:
      - "aula-02-*"
    paths:
      - "aula-02-hadoop/**"
      - ".github/workflows/lab-check-aula-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrigir-lab:
    name: Rodar testes automaticos do lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker do lab
        working-directory: aula-02-hadoop
        run: docker build -t lab-aula-02 .

      - name: Rodar testes (correcao automatica)
        working-directory: aula-02-hadoop
        run: |
          set -o pipefail
          docker run --rm lab-aula-02 pytest -v --tb=short | tee test_output.txt

      - name: Publicar resumo da correcao
        if: always()
        shell: bash
        working-directory: aula-02-hadoop
        run: |
          {
            echo "## Resultado da correcao automatica - Aula 02 (Hadoop)"
            echo ""
            echo '```'
            cat test_output.txt 2>/dev/null || echo "Nenhum output de teste disponivel"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
